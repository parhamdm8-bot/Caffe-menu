<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>caffee | کافه ری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500&family=Vazirmatn:wght@300;400;600&display=swap">
<style>
:root{--g:#165E20;--g2:#1f8a2e;--gold:#9A7300;--bg:#f7f4ec;--card:#ffffff;--tx:#1b1b1b;--h:64px;
--brand:"Bahnschrift Condensed","Bahnschrift","Oswald","Arial Narrow",sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:"Vazirmatn",Tahoma,sans-serif;padding-top:calc(var(--h) + env(safe-area-inset-top,0px));min-height:100vh}
.brand{font-family:var(--brand);letter-spacing:.12em;text-transform:lowercase}
/* intro */
#intro{position:fixed;inset:0;z-index:100;background:var(--g);display:grid;place-items:center;transition:opacity .8s}
#intro.out{opacity:0;pointer-events:none}
#intro h1{font-family:var(--brand);font-weight:400;font-size:clamp(48px,14vw,120px);color:#F0D77A;letter-spacing:.2em;direction:ltr;display:flex}
#intro span{opacity:0;transform:translateY(24px);animation:in .7s forwards}
#intro.leave h1{animation:leave .9s forwards}
#intro::after{content:"";position:absolute;bottom:38%;width:0;height:2px;background:#F0D77A;animation:ln 1.6s .4s forwards}
@keyframes in{to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;letter-spacing:.7em;filter:blur(8px)}}
@keyframes ln{to{width:min(260px,50vw)}}
/* header */
header{position:fixed;top:0;inset-inline:0;z-index:50;height:calc(var(--h) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:rgba(247,244,236,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--g)}
header .name{font-size:clamp(24px,6vw,34px);color:var(--gold);text-align:center}
header a{color:var(--tx);text-decoration:none}
.about{justify-self:start;font-size:14px;color:var(--gold);border:1px solid var(--g);padding:6px 12px;border-radius:20px;transition:.2s}
.about:hover{background:var(--g);color:#fff}
.contact{justify-self:end;text-align:left;direction:ltr;font-size:12px;line-height:1.5;display:flex;flex-direction:column}
.contact b{font-weight:600;letter-spacing:.05em}
.contact span{color:var(--gold)}
/* menu nav */
nav{position:sticky;top:calc(var(--h) + env(safe-area-inset-top,0px));z-index:40;background:rgba(247,244,236,.95);display:flex;justify-content:center;gap:6px;padding:12px 10px;overflow-x:auto;border-bottom:1px solid #e2dccb}
nav button{font:inherit;font-size:15px;color:#666;background:none;border:1px solid transparent;padding:8px 18px;border-radius:24px;cursor:pointer;white-space:nowrap;transition:.25s}
nav button.on{background:var(--g);color:#fff;border-color:var(--gold)}
main{max-width:860px;margin:0 auto;padding:36px 18px 20px}
h2{font-weight:300;font-size:26px;color:var(--gold);margin-bottom:22px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(to left,var(--g),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.item{background:var(--card);border:1px solid #dfe6dc;border-radius:12px;padding:18px 16px;display:flex;align-items:center;gap:12px;transition:.25s}
.item:hover{border-color:var(--gold);transform:translateY(-2px)}
.item::before{content:"";width:7px;height:7px;background:var(--gold);transform:rotate(45deg);flex:none}
.cat{display:none;animation:in .5s forwards}
.cat.on{display:block}
#about{max-width:860px;margin:50px auto 0;padding:34px 18px 60px;scroll-margin-top:calc(var(--h) + 20px + env(safe-area-inset-top,0px))}
.box{background:var(--card);border:1px solid var(--g);border-radius:14px;padding:8px 22px}
.row{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid #e6e2d4;flex-wrap:wrap}
.row:last-child{border:0}
.row span{color:var(--gold)}
.row div{direction:ltr;text-align:left}
.row .fa{direction:rtl}
footer{text-align:center;padding:24px;color:#999;font-size:12px;font-family:var(--brand);letter-spacing:.2em}
</style>
</head>
<body>
<div id="intro"><h1 id="t"></h1></div>

<header>
  <a class="about" href="#about">درباره ما</a>
  <div class="name brand">caffee</div>
  <div class="contact"><b>02112345678</b><span>@caffeerey</span></div>
</header>

<nav id="nav">
  <button class="on" data-c="cold">نوشیدنی سرد</button>
  <button data-c="hot">نوشیدنی گرم</button>
  <button data-c="cake">کیک</button>
  <button data-c="shake">شیک</button>
</nav>

<main id="menu"></main>

<section id="about">
  <h2>درباره ما</h2>
  <div class="box">
    <div class="row"><span>شماره تماس</span><div>02112345678 &nbsp;-&nbsp; 09123456789</div></div>
    <div class="row"><span>پیج اینستاگرام</span><div>@caffeerey</div></div>
    <div class="row"><span>آدرس</span><div class="fa">تهران - شهرری - کافه ری</div></div>
  </div>
</section>
<footer>caffee</footer>

<script>
const data={
cold:["آیس آمریکانو","آیس موکا","آیس کاراملو","آیس چاکلت","آیس لاته"],
hot:["هات چاکلت","شیر عسل","اسپرسو","اسپرسو دبل","آمریکانو","آمریکانو دبل","لاته","قهوه ترک","ماسالا","کاپوچینو","نسکافه"],
cake:["ترامیسو","کروسان","کیک خیس","کیک شکلاتی","چیز کیک","کیک گردو","کیک هویج"],
shake:["شیک نسکافه","شیک نوتلا","شیک مخصوص","شیک شکلات","شیک میوه"]};
const titles={cold:"نوشیدنی سرد",hot:"نوشیدنی گرم",cake:"کیک",shake:"شیک"};
const m=document.getElementById("menu");
for(const k in data){
  m.insertAdjacentHTML("beforeend",`<section class="cat${k==="cold"?" on":""}" id="${k}"><h2>${titles[k]}</h2><div class="grid">${data[k].map(i=>`<div class="item">${i}</div>`).join("")}</div></section>`);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button,.cat").forEach(e=>e.classList.remove("on"));
  b.classList.add("on");document.getElementById(b.dataset.c).classList.add("on");
  window.scrollTo({top:0,behavior:"smooth"});
});
// intro
const t=document.getElementById("t"),intro=document.getElementById("intro");
[..."caffee"].forEach((c,i)=>{const s=document.createElement("span");s.textContent=c;s.style.animationDelay=(i*.15)+"s";t.appendChild(s)});
setTimeout(()=>intro.classList.add("leave"),2300);
setTimeout(()=>{intro.classList.add("out");setTimeout(()=>intro.remove(),900)},3100);
</script>
</body>
</html>
